name: Monitoreo Fincaraiz

on:
  schedule:
    - cron: '*/30 * * * *' # Se ejecuta cada 30 minutos
  workflow_dispatch: # Te permite ejecutarlo manualmente con un botón

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install cloudscraper requests beautifulsoup4

      - name: Ejecutar Scraper
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scraper.py

      - name: Guardar base de datos de IDs (Commit)
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Actualiza lista de apartamentos vistos"
          file_pattern: inmuebles_vistos.json
